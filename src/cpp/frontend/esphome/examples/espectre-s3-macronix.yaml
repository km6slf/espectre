# ESPectre - ESP32-S3 Configuration
# WiFi CSI-based motion detection with Home Assistant integration
#
# Compatible with ESP32-S3 boards using Macronix MX25L128 or other flash chips that fail MSPI bus tuning at 80MHz.
# Targets 40MHz DIO Flash and internal SRAM without requiring 80MHz Octal PSRAM.
#
# Provisioning:
# - Via USB: Use Improv Serial with `./espectre provision --ssid MyNetwork`
#   or any Improv Serial-compatible web flasher, such as https://espectre.dev/tools/flash/
# - Via WiFi: Connect to "ESPectre Fallback" AP and configure

substitutions:
  component_source: github # github or local
  example_config: espectre-s3.yaml

packages:
  component_source: !include espectre-source-${component_source}.yaml

esphome:
  name: espectre
  friendly_name: ESPectre
  min_version: 2026.7.0
  # Keep the hostname unique when one official image is used on multiple devices.
  name_add_mac_suffix: true
  project:
    name: francescopace.espectre
    version: ${project_version}

esp32:
  variant: ESP32S3
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# PSRAM support (8MB on most S3 boards)
# ESPectre - WiFi CSI Motion Detection
espectre:
  id: espectre_csi
  detection_algorithm: high_accuracy # lightweight (default) or high_accuracy
  traffic_generator_mode: ping # ping (default), dns (UDP), dns_tcp, wifi_raw, or external
  evaluation_interval_ms: 250 # 250-1000 recommended; detector and live telemetry interval
  direct_api: true # Set false to disable Direct HTTP, SSE, raw CSI, and Direct mDNS discovery

# WiFi with fallback AP for provisioning
wifi:
  ap:
    ssid: "ESPectre Fallback"

captive_portal:

# Improv provisioning via USB
improv_serial:
  next_url: "https://espectre.dev/tools/device-settings/?target={{ip_address}}"

# Logging
logger:
  level: INFO
  #hardware_uart: UART0  # Uncomment for boards with external USB-UART bridges (CH340, CP2102, etc.)

# Home Assistant API
api:

# OTA updates
ota:
  - platform: esphome
